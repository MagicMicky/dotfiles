# kitty configuration
# Reload live with ⌘+ctrl+, — no restart needed.
# Full documented reference for every option: kitty.conf.reference (in this dir).

# ---- Font ----
# Menlo is a safe macOS built-in. To upgrade, install a font (e.g. JetBrains
# Mono) and change the family below. List available: kitty +list-fonts
font_family      Menlo
font_size        12.0

# ---- macOS niceties ----
macos_option_as_alt                 yes
macos_quit_when_last_window_closed  yes
hide_window_decorations             titlebar-only
macos_titlebar_color                background

# ---- Cursor ----
cursor_blink_interval  0
cursor_shape           block

# ---- Scrollback ----
scrollback_lines  10000

# ---- Bell ----
enable_audio_bell    no
visual_bell_duration 0.0

# ---- Tabs ----
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted

# ---- Windows / layout ----
enabled_layouts         splits,stack
window_padding_width    6
confirm_os_window_close 0

# ---- Mouse ----
copy_on_select  yes

# ---- Keyboard shortcuts ----
# Splits (iTerm2-style). New panes inherit the current directory.
map cmd+d       launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current

# Move between panes, vim-style. On cmd+alt because plain cmd+h is macOS
# "hide app" and cmd+k / cmd+l are kitty "clear terminal".
map cmd+alt+h neighboring_window left
map cmd+alt+j neighboring_window down
map cmd+alt+k neighboring_window up
map cmd+alt+l neighboring_window right

# Resize the focused pane.
map cmd+ctrl+h resize_window narrower
map cmd+ctrl+j resize_window taller
map cmd+ctrl+k resize_window shorter
map cmd+ctrl+l resize_window wider
map cmd+ctrl+0 resize_window reset

# New tab opens fresh (home dir), not the current directory.
map cmd+t     new_tab

# Disable cmd+enter (default new_window) — redundant with cmd+d splits.
map cmd+enter no_op

# Pop a shortcut cheatsheet in an overlay (press q to close).
map cmd+/ launch --type=overlay --title "kitty shortcuts" less -R ${HOME}/.config/kitty/shortcuts.txt

# Native macOS fullscreen (green-button style) is already ctrl+cmd+f by
# default; macos_traditional_fullscreen stays "no" to keep it native.

# ---- Theme (managed by: kitty +kitten themes) ----
include current-theme.conf
